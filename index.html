<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hoot in Saraiki (test)</title>
<style>
  body { margin: 0; min-height: 100vh; background: #f6faf7; color: #1c2b23; font: 500 18px/1.5 -apple-system, sans-serif;
    display: flex; flex-direction: column; align-items: center; padding: 28px 20px; box-sizing: border-box; }
  .owl { font-size: 72px; transition: transform .2s; } .owl.talking { transform: scale(1.12); }
  h1 { font-size: 22px; margin: 6px 0 2px; } .sub { color: #6b7d73; font-size: 14px; margin-bottom: 18px; }
  button { font: inherit; font-weight: 800; color: #fff; background: #1cb0f6; border: 0; border-bottom: 4px solid #1899d6; border-radius: 16px; padding: 14px 28px; }
  button.end { background: #ff4b4b; border-bottom-color: #d33; }
  #status { color: #1899d6; font-weight: 700; min-height: 1.6em; margin: 14px 0 6px; }
  #log { width: 100%; max-width: 720px; margin-top: 10px; }
  .turn { background: #fff; border: 2px solid #e3e9e5; border-radius: 14px; padding: 10px 14px; margin-bottom: 10px; font-size: 20px; }
  .turn.you { background: #eef7ff; } .turn b { display: block; font-size: 12px; color: #6b7d73; text-transform: uppercase; letter-spacing: .05em; }
  .turn span { direction: rtl; unicode-bidi: plaintext; display: block; }
</style></head>
<body>
  <div class="owl" id="owl">🦉</div>
  <h1>Hoot in Saraiki</h1>
  <div class="sub">A test. Tap Start, allow the microphone, and talk in Saraiki. Each talk is limited to 5 minutes.</div>
  <button id="go">Start talking</button>
  <div id="status"></div>
  <div id="log"></div>
<script src="elevenlabs-client.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); }, session = null;
  function status(t) { $('status').textContent = t; }
  function add(who, text) {
    var d = document.createElement('div'); d.className = 'turn' + (who === 'You' ? ' you' : '');
    var b = document.createElement('b'); b.textContent = who; var s = document.createElement('span'); s.textContent = text;
    d.appendChild(b); d.appendChild(s); $('log').insertBefore(d, $('log').firstChild);
  }
  function stopped() { session = null; $('go').textContent = 'Start talking'; $('go').className = ''; $('owl').className = 'owl'; }
  $('go').onclick = function () {
    if (session) { session.endSession(); return; }
    status('Connecting…');
    Promise.resolve().then(function () {
      return ElevenLabsClient.Conversation.startSession({
        agentId: 'agent_3001m43ybytsetq8kf489bqqqp8p',
        connectionType: 'webrtc',
        onConnect: function () { status(''); $('go').textContent = 'End conversation'; $('go').className = 'end'; },
        onDisconnect: function () { status('Ended.'); stopped(); },
        onError: function (m) { status('Error: ' + m); },
        onModeChange: function (m) { var sp = m && m.mode === 'speaking'; $('owl').className = 'owl' + (sp ? ' talking' : ''); if (session) status(sp ? '' : 'Listening. Just talk.'); },
        onMessage: function (m) { if (m && m.message && /\S/.test(m.message.replace(/\./g, ''))) add(m.source === 'user' || m.role === 'user' ? 'You' : 'Hoot', m.message); }
      });
    }).then(function (s) { session = s; }).catch(function (e) { status('Could not start: ' + (e && e.message || e)); stopped(); });
  };
})();
</script>
</body></html>
